name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:resolute
    steps:
      - name: Install system dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates cmake git libgtest-dev libxml2-dev \
            libyaml-dev pkg-config
      - uses: actions/checkout@v4
        with:
          path: src/downstream_bin_a
      - uses: actions/checkout@v4
        with:
          repository: rep159-testing/upstream_a
          ref: main
          path: src/upstream_a
      - uses: actions/checkout@v4
        with:
          repository: rep159-testing/upstream_b
          ref: main
          path: src/upstream_b
      - uses: actions/checkout@v4
        with:
          repository: rep159-testing/upstream_c
          ref: main
          path: src/upstream_c
      # binext imports upstream as binaries: install the chain under the
      # prefix its debs would use, apart from this package's build.
      - name: Install the upstream chain under /opt/ros/upstream
        shell: bash
        run: |
          set -euo pipefail
          prefix=/opt/ros/upstream
          for pkg in upstream_a upstream_b upstream_c; do
            cmake -S "src/$pkg" -B "build/$pkg" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_PREFIX_PATH="$prefix" -DBUILD_TESTING=OFF
            cmake --build "build/$pkg" --parallel
            cmake --install "build/$pkg"
          done
      - name: Build and test against /opt/ros/upstream
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH=/opt/ros/upstream/lib
          cmake -S src/downstream_bin_a -B build/downstream_bin_a -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/ros/upstream -DBUILD_TESTING=ON
          cmake --build build/downstream_bin_a --parallel
          ctest --test-dir build/downstream_bin_a --output-on-failure --no-tests=error
